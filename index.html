<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualizer — Upload CSV/JSON, get charts</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Upload a CSV or JSON file and instantly get interactive charts.">
<link rel="stylesheet" href="css/style.css?v=202609121904">
</head>
<body>
<header class="site-header">
<h1>Data Visualizer</h1>
<p>Upload a CSV or JSON file. Get interactive charts.</p>
<div class="dv-features">
  <span>4 chart types</span>
  <span>No upload</span>
  <span>100% in-browser</span>
</div>
</header>
<main class="container">
<section class="upload-zone" id="uploadZone">
<input type="file" id="fileInput" accept=".csv,.json" hidden>
<div class="upload-prompt">
<span class="upload-icon">📁</span>
<strong>Drop a file here</strong>
<span>or <button type="button" id="browseBtn">browse</button></span>
<span class="hint">Accepts .csv and .json</span>
<div style="margin-top:1rem"><button type="button" id="loadSampleBtn" class="btn-sample"> Try with sample data</button></div>
</div>
</section>
<section class="preview hidden" id="previewSection">
<div class="preview-header">
<h2>Data Preview</h2>
<button type="button" id="clearBtn" class="btn-secondary">Clear</button>
</div>
<div class="table-wrapper">
<table id="previewTable"></table>
</div>
</section>
<section class="charts hidden" id="chartsSection">
<div class="chart-controls">
<label>X axis: <select id="xAxisSelect"></select></label>
<label>Y axis: <select id="yAxisSelect"></select></label>
<label>Chart type: <select id="chartTypeSelect">
<option value="bar">Bar</option>
<option value="line">Line</option>
<option value="pie">Pie</option>
<option value="scatter">Scatter</option>
</select></label>
</div>
<div class="chart-wrapper">
<canvas id="mainChart"></canvas>
</div>
</section>
<section class="stats hidden" id="statsSection">
<h2>Summary</h2>
<div class="stats-grid" id="statsGrid"></div>
</section>
</main>
<footer class="site-footer">
<p>Built with vanilla JS + Chart.js • <a href="https://github.com/Zannii34/data-visualizer">View on GitHub</a></p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>
<footer class="wk-footer">
  <span class="wk-badge">WK</span>
  Built by <a href="https://zannii34.github.io" target="_blank" rel="noopener">Wayne Kamachetera</a>
  · <a href="https://github.com/Zannii34/data-visualizer" target="_blank" rel="noopener">GitHub</a>
</footer>
<script src="js/interactive.js"></script>`n</body>
</html>
